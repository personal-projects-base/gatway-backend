spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:4200"
              - "https://develop.4libert.com"
              - "https://4libert.com"
              - "https://app.4libert.com"
              - "https://smartverse.com.br"
              - "https://develop.smartverse.com.br"
              - "https://app.smartverse.com.br"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

  application:
    name: smart-bridge-backend

server:
  port: 5000

logging:
  level:
    org.springframework.web.reactive.function.client.ExchangeFunctions: TRACE
    org.springframework.cloud.gateway: DEBUG

# As rotas são carregadas exclusivamente da coleção MongoDB "gateway_routes".
gateway:
  routes:
    refresh-interval-ms: ${GATEWAY_ROUTES_REFRESH_INTERVAL_MS:15000}

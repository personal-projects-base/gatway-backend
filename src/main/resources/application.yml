spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:4200"
              - "https://develop.4libert.com"
              - "https://4libert.com"
              - "https://app.4libert.com"
              - "https://smartverse.com.br"
              - "https://develop.smartverse.com.br"
              - "https://app.smartverse.com.br"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: church-lite-backend
          uri: http://localhost:5050
          predicates:
            - Path=/api/church-lite/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        - id: smart-report-backend
          uri: http://localhost:5070
          predicates:
            - Path=/api/smartreport/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        - id: smart-agendei-backend
          uri: http://localhost:5030
          predicates:
            - Path=/api/smartagendei/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        - id: smart-finance-telegram-backend
          uri: http://localhost:5080
          predicates:
            - Path=/api/smartfinance/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

  application:
    name: api-gateway

server:
  port: 5000

logging:
  level:
    org.springframework.web.reactive.function.client.ExchangeFunctions: TRACE
    org.springframework.cloud.gateway: DEBUG